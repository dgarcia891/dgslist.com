<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>David's List</title>
<meta name="description" content="Things David actually uses, loves, and keeps recommending.">
<meta property="og:title" content="David's List">
<meta property="og:description" content="Things I actually use, love, and keep recommending.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>★</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="sample-banner" class="sample-banner" hidden>Preview with sample picks — the real list is coming soon.</div>

  <header class="hero">
    <div class="wrap">
      <p class="eyebrow">dgslist.com</p>
      <h1>David's List</h1>
      <p class="lede">Things I actually use, love, and keep recommending. If you asked me "what should I get?" — the answer's probably here.</p>
    </div>
  </header>

  <main class="wrap">
    <div class="controls">
      <label class="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Search — try “coffee” or “tacos”" autocomplete="off" aria-label="Search recommendations">
      </label>
      <nav id="tabs" class="tabs" aria-label="Categories"></nav>
    </div>

    <p id="count" class="count" aria-live="polite"></p>
    <section id="grid" class="grid"></section>
    <p id="empty" class="empty" hidden>Nothing matches that yet. Text me — maybe it should be on here.</p>
  </main>

  <footer class="wrap footer">
    <p id="updated"></p>
    <p id="disclosure" hidden></p>
  </footer>

  <dialog id="detail" class="detail" aria-labelledby="d-title">
    <button class="close" type="button" aria-label="Close" data-close>×</button>
    <div id="d-media" class="d-media"></div>
    <div class="d-body">
      <p id="d-cat" class="d-cat"></p>
      <h2 id="d-title"></h2>
      <div id="d-note" class="d-note"></div>
      <div id="d-tags" class="tags"></div>
      <div class="d-actions">
        <a id="d-link" class="btn primary" target="_blank" rel="noopener"></a>
        <button id="d-share" class="btn" type="button">Copy link to share</button>
      </div>
    </div>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
